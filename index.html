                                    <div key={vendor} className="mb-8 border border-gray-200 rounded-lg overflow-hidden shadow-sm">
                                        <div className="bg-gray-100 px-4 py-3 border-b border-gray-200 flex justify-between items-center">
                                            <h3 className="font-bold text-gray-800"><i className="fas fa-building text-gray-500 mr-2"></i>{vendor}</h3>
                                        </div>
                                        
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left min-w-max">
                                                <thead className="bg-white text-xs text-gray-500 border-b">
                                                    <tr>
                                                        <th className="p-2 w-12"></th>
                                                        <th className="p-2 w-72">精機型號 / 細項</th>
                                                        <th className="p-2 w-40">廠商型號</th>
                                                        <th className="p-2 text-right w-24">單價(RMB)</th>
                                                        <th className="p-2 text-right w-24 border-l">單價(USD)</th>
                                                        <th className="p-2 w-32">描述</th>
                                                        <th className="p-2 text-center w-60">操作</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-gray-100 text-sm bg-white">
                                                    {Object.keys(nestedPrices[vendor]).map(category => {
                                                        const catKey = `${vendor}-${category}`;
                                                        const isCatExp = expandedCategories[catKey] === true || priceSearch.model.trim() !== '';

                                                        return (
                                                            <React.Fragment key={category}>
                                                                <tr className="bg-gray-50 cursor-pointer hover:bg-gray-100 transition-colors" onClick={() => toggleCategoryExpand(catKey)}>
                                                                    <td colSpan="7" className="p-2.5 font-bold text-pink-600 border-y shadow-inner">
                                                                        <div className="flex items-center">
                                                                            <i className={`fas fa-chevron-${isCatExp ? 'down' : 'right'} mr-2 text-xs text-gray-400 w-4 text-center`}></i>
                                                                            <i className="fas fa-folder mr-2 text-pink-500"></i>
                                                                            <span>【{category}】</span>
                                                                        </div>
                                                                    </td>
                                                                </tr>
                                                                
                                                                {isCatExp && (() => {
                                                                    const sortedMainModels = Object.keys(nestedPrices[vendor][category]).sort((a, b) => {
                                                                        const idxA = nestedPrices[vendor][category][a][0]?.groupSortIndex ?? 9999;
                                                                        const idxB = nestedPrices[vendor][category][b][0]?.groupSortIndex ?? 9999;
                                                                        return idxA - idxB;
                                                                    });

                                                                    return sortedMainModels.map(mainModel => {
                                                                        const groupKey = `${vendor}-${category}-${mainModel}`;
                                                                        const isExp = expandedPrices[groupKey] === true || priceSearch.model.trim() !== ''; 
                                                                        const items = nestedPrices[vendor][category][mainModel];
                                                                        const isDraggable = priceSearch.model.trim() === ''; 

                                                                        return (
                                                                            <React.Fragment key={mainModel}>
                                                                                <tr 
                                                                                    draggable={isDraggable}
                                                                                    onDragStart={(e) => handleMainModelDragStart(e, vendor, category, mainModel)}
                                                                                    onDragEnd={handleMainModelDragEnd}
                                                                                    onDragOver={handleMainModelDragOver}
                                                                                    onDrop={(e) => handleMainModelDrop(e, vendor, category, mainModel)}
                                                                                    className={`cursor-pointer transition-colors ${draggedMainModel?.mainModel === mainModel ? 'bg-blue-100' : 'hover:bg-gray-100'}`}
                                                                                    onClick={() => togglePriceExpand(groupKey)}
                                                                                >
                                                                                    <td className="p-2 text-center text-gray-400">
                                                                                        <i className={`fas fa-grip-vertical mr-2 ${isDraggable ? 'cursor-grab hover:text-gray-600' : 'opacity-30 cursor-not-allowed'}`}></i>
                                                                                        <i className={`fas fa-chevron-${isExp?'up':'down'}`}></i>
                                                                                    </td>
                                                                                    <td colSpan="6" className="p-2 font-bold text-gray-900 text-base">{mainModel} <span className="text-xs text-gray-500 font-normal ml-2">({items.length} 個細項)</span></td>
                                                                                </tr>
                                                                                
                                                                                {isExp && items.map((p) => {
                                                                                    const hasBom = p.bomItems && p.bomItems.length > 0;
                                                                                    return (
                                                                                        <tr key={p.id} 
                                                                                            draggable={isDraggable}
                                                                                            onDragStart={(e) => { e.stopPropagation(); handleDragStart(e, p.id); }} 
                                                                                            onDragEnd={handleDragEnd}
                                                                                            onDragOver={handleDragOver} 
                                                                                            onDrop={(e) => handleDrop(e, p.id, items)}
                                                                                            className={`transition-colors bg-[#f4f9ff] hover:bg-blue-50 cursor-pointer ${draggedPriceId === p.id ? 'bg-blue-100' : ''}`}
                                                                                        >
                                                                                            <td className="p-2 text-center text-gray-300">
                                                                                                <i className={`fas fa-grip-vertical ml-4 ${isDraggable ? 'cursor-grab hover:text-gray-500' : 'cursor-not-allowed opacity-50'}`}></i>
                                                                                            </td>
                                                                                            <td className="p-2 font-bold text-gray-800 flex items-center">
                                                                                                <i className="fas fa-level-up-alt fa-rotate-90 text-gray-300 mr-2"></i>
                                                                                                {p.model}
                                                                                                {hasBom && <span className="ml-2 bg-blue-100 text-blue-800 text-[10px] px-1.5 py-0.5 rounded font-bold">BOM</span>}
                                                                                            </td>
                                                                                            <td className="p-2 text-gray-600">{p.vendorModel || '-'}</td>
                                                                                            <td className="p-2 text-right pr-2 font-bold text-blue-700">{formatRMB(p.price)}</td>
                                                                                            <td className="p-2 text-right pr-2 text-gray-500 border-l">{formatUSD(p.priceUsd)}</td>
                                                                                            <td className="p-2 text-gray-500 text-xs truncate max-w-[120px]" title={p.remark}>{p.remark || '-'}</td>
                                                                                            <td className="p-2 text-center whitespace-nowrap" onClick={e => e.stopPropagation()}>
                                                                                                <button onClick={() => openInventoryModal(p)} className="text-green-600 hover:text-green-800 mx-1 bg-green-55 border border-green-200 px-2 py-1 rounded shadow-sm text-xs font-bold" title="管理庫存"><i className="fas fa-warehouse mr-1"></i>管理庫存</button>
                                                                                                <button onClick={() => setBomModal({ isOpen: true, priceId: p.id, modelName: p.model, items: p.bomItems ? JSON.parse(JSON.stringify(p.bomItems)) : [] })} className="text-purple-600 hover:text-purple-800 mx-1 bg-purple-50 px-2 py-1 rounded shadow-sm text-xs font-bold" title="BOM"><i className="fas fa-boxes mr-1"></i>BOM</button>
                                                                                                <button onClick={() => setPriceModal({ 
                                                                                                    isOpen: true, id: p.id, vendor: p.vendor, 
                                                                                                    category: p.category || '平縫', customCategory: '', mainModel: p.mainModel || '', 
                                                                                                    items: [{ model: p.model, vendorModel: p.vendorModel || '', price: p.price, priceUsd: p.priceUsd || '', remark: p.remark || '' }], 
                                                                                                    reason: '' 
                                                                                                })} className="text-blue-600 hover:text-blue-800 mx-1 bg-blue-50 px-2 py-1 rounded shadow-sm text-xs" title="修改"><i className="fas fa-edit mr-1"></i>編輯</button>
                                                                                                <button onClick={() => handleDeletePriceItem(p.id)} className="text-red-500 hover:text-red-700 mx-1 bg-red-50 px-2 py-1 rounded shadow-sm text-xs" title="刪除"><i className="fas fa-trash-alt mr-1"></i>刪除</button>
                                                                                            </td>
                                                                                        </tr>
                                                                                    );
                                                                                })}
                                                                            </React.Fragment>
                                                                        )
                                                                    });
                                                                })()}
                                                            </React.Fragment>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>

                        {/* 管理員庫存彈跳視窗 */}
                        {invModal.isOpen && (
                            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 overflow-y-auto">
                                <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-4xl my-auto space-y-4">
                                    <div className="flex justify-between items-center border-b pb-2">
                                        <h2 className="text-lg font-bold text-green-900"><i className="fas fa-warehouse mr-2"></i>庫存管理：{invModal.modelItem?.model}</h2>
                                        <button onClick={() => setInvModal({ isOpen: false, modelItem: null, kunshan: 0, taiwan: 0, shipments: [], pendingShipments: [] })} className="text-gray-400 hover:text-gray-800"><i className="fas fa-times"></i></button>
                                    </div>

                                    {/* 數量面板 */}
                                    <div className="grid grid-cols-2 md:grid-cols-5 gap-3 bg-gray-50 p-4 rounded-lg border text-center">
                                        <div>
                                            <p className="text-xs text-gray-500 font-bold mb-1">採購中</p>
                                            <p className="text-lg font-bold text-orange-600">{getPendingQtyForModel(invModal.modelItem?.model || '')}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-gray-500 font-bold mb-1">崑山庫存</p>
                                            <input type="number" value={invModal.kunshan} onChange={e => setInvModal({...invModal, kunshan: e.target.value})} className="w-full border p-1 text-center font-bold rounded bg-white" />
                                        </div>
                                        <div>
                                            <p className="text-xs text-gray-500 font-bold mb-1">台灣庫存</p>
                                            <input type="number" value={invModal.taiwan} onChange={e => setInvModal({...invModal, taiwan: e.target.value})} className="w-full border p-1 text-center font-bold rounded bg-white" />
                                        </div>
                                        <div>
                                            <p className="text-xs text-gray-500 font-bold mb-1">預計出貨總數</p>
                                            <p className="text-lg font-bold text-purple-600">{invModal.pendingShipments.reduce((sum, s) => sum + (Number(s.qty) || 0), 0)}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-gray-500 font-bold mb-1">剩餘庫存</p>
                                            <p className="text-lg font-black text-green-600">{(Number(invModal.kunshan) || 0) + (Number(invModal.taiwan) || 0) - invModal.pendingShipments.reduce((sum, s) => sum + (Number(s.qty) || 0), 0)}</p>
                                        </div>
                                    </div>

                                    {/* 預計出貨清單與新增 */}
                                    <div className="border-t pt-3">
                                        <h4 className="font-bold text-sm text-gray-800 mb-2">預計出貨項目管理</h4>
                                        <div className="flex gap-2 mb-3">
                                            <input type="text" placeholder="單位 (例如: 台/套)" value={newShipmentInput.unit} onChange={e => setNewShipmentInput({...newShipmentInput, unit: e.target.value})} className="border p-1.5 text-sm rounded w-32" />
                                            <input type="number" placeholder="數量" value={newShipmentInput.qty} onChange={e => setNewShipmentInput({...newShipmentInput, qty: e.target.value})} className="border p-1.5 text-sm rounded w-24 text-center" />
                                            <input type="text" placeholder="收貨客戶/目的地" value={newShipmentInput.recipient} onChange={e => setNewShipmentInput({...newShipmentInput, recipient: e.target.value})} className="border p-1.5 text-sm rounded flex-1" />
                                            <input type="date" value={newShipmentInput.date} onChange={e => setNewShipmentInput({...newShipmentInput, date: e.target.value})} className="border p-1.5 text-sm rounded" />
                                            <button type="button" onClick={handleAddPendingShipment} className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded text-sm font-bold">新增預計出貨</button>
                                        </div>
                                        <div className="space-y-2 max-h-36 overflow-y-auto">
                                            {invModal.pendingShipments.map(s => (
                                                <div key={s.id} className="flex justify-between items-center bg-blue-50/50 border p-2 rounded text-sm">
                                                    <div>
                                                        <span className="font-bold mr-3">單位：{s.unit}</span>
                                                        <span className="font-bold text-blue-600 mr-3">數量：{s.qty}</span>
                                                        <span className="text-gray-600 mr-3">客戶：{s.recipient || '-'}</span>
                                                        <span className="text-xs text-gray-400">預計日期：{s.date}</span>
                                                    </div>
                                                    <button onClick={() => handleCompleteShipment(s.id)} className="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-xs font-bold">出貨完成</button>
                                                </div>
                                            ))}
                                            {invModal.pendingShipments.length === 0 && <div className="text-xs text-gray-400 text-center py-2">目前無預計出貨單。</div>}
                                        </div>
                                    </div>

                                    {/* 出貨紀錄 */}
                                    <div className="border-t pt-3">
                                        <h4 className="font-bold text-sm text-gray-800 mb-2">已完成出貨紀錄</h4>
                                        <div className="space-y-1 max-h-32 overflow-y-auto">
                                            {invModal.shipments.map((sh, idx) => (
                                                <div key={idx} className="flex justify-between items-center bg-gray-50 border p-2 rounded text-xs text-gray-600">
                                                    <div>
                                                        <span className="font-bold text-gray-800 mr-2">單位：{sh.unit}</span>
                                                        <span className="font-bold text-green-700 mr-2">數量：{sh.qty}</span>
                                                        <span className="mr-2">客戶：{sh.recipient || '-'}</span>
                                                    </div>
                                                    <span>完成日期：{sh.completedDate}</span>
                                                </div>
                                            ))}
                                            {invModal.shipments.length === 0 && <div className="text-xs text-gray-400 text-center py-2">尚無出貨紀錄。</div>}
                                        </div>
                                    </div>

                                    <div className="flex gap-2 pt-4 border-t">
                                        <button type="button" onClick={() => setInvModal({ isOpen: false, modelItem: null, kunshan: 0, taiwan: 0, shipments: [], pendingShipments: [] })} className="flex-1 py-2 bg-gray-100 rounded text-sm font-bold text-gray-700">取消</button>
                                        <button type="button" onClick={saveInventoryData} className="flex-1 py-2 bg-green-600 hover:bg-green-700 text-white rounded text-sm font-bold shadow-sm">儲存庫存變更</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* BOM 管理視窗 */}
                        {bomModal.isOpen && (
                            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 overflow-y-auto">
                                <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-4xl my-auto">
                                    <div className="flex justify-between items-center mb-4 border-b pb-2">
                                        <div>
                                            <h2 className="text-lg font-bold text-purple-900"><i className="fas fa-boxes mr-2"></i>【{bomModal.modelName}】BOM (物料清單) 管理</h2>
                                            <p className="text-xs text-gray-500 mt-0.5">新增或修改組件後儲存，系統會自動加總總價並更新回該型號的 RMB 單價。</p>
                                        </div>
                                        <button onClick={() => setBomModal({ isOpen: false, priceId: null, modelName: '', items: [] })} className="text-gray-400 hover:text-gray-800"><i className="fas fa-times"></i></button>
                                    </div>

                                    <div className="space-y-3 max-h-[50vh] overflow-y-auto p-1">
                                        <div className="grid grid-cols-12 gap-2 text-xs font-bold text-gray-600 px-2">
                                            <div className="col-span-2">料號</div>
                                            <div className="col-span-3">名稱</div>
                                            <div className="col-span-1 text-center">數量</div>
                                            <div className="col-span-2 text-right">單價 (RMB)</div>
                                            <div className="col-span-3">備註</div>
                                            <div className="col-span-1 text-center">操作</div>
                                        </div>

                                        {bomModal.items.map((bItem, bIdx) => (
                                            <div key={bIdx} className="grid grid-cols-12 gap-2 items-center bg-gray-50 p-2 rounded-lg border shadow-sm">
                                                <div className="col-span-2"><input type="text" placeholder="料號" value={bItem.partNo || ''} onChange={e => { const n = [...bomModal.items]; n[bIdx].partNo = e.target.value; setBomModal({...bomModal, items: n}); }} className="w-full border p-1.5 rounded text-sm bg-white" /></div>
                                                <div className="col-span-3"><input type="text" placeholder="名稱" value={bItem.name || ''} onChange={e => { const n = [...bomModal.items]; n[bIdx].name = e.target.value; setBomModal({...bomModal, items: n}); }} className="w-full border p-1.5 rounded text-sm bg-white" /></div>
                                                <div className="col-span-1"><input type="number" step="1" placeholder="數量" value={bItem.qty || 1} onChange={e => { const n = [...bomModal.items]; n[bIdx].qty = e.target.value; setBomModal({...bomModal, items: n}); }} className="w-full border p-1.5 rounded text-sm text-center bg-white" /></div>
                                                <div className="col-span-2"><input type="number" step="0.01" placeholder="單價" value={bItem.unitPrice || 0} onChange={e => { const n = [...bomModal.items]; n[bIdx].unitPrice = e.target.value; setBomModal({...bomModal, items: n}); }} className="w-full border p-1.5 rounded text-sm text-right bg-white" /></div>
                                                <div className="col-span-3"><input type="text" placeholder="備註..." value={bItem.remark || ''} onChange={e => { const n = [...bomModal.items]; n[bIdx].remark = e.target.value; setBomModal({...bomModal, items: n}); }} className="w-full border p-1.5 rounded text-sm bg-white" /></div>
                                                <div className="col-span-1 text-center"><button type="button" onClick={() => { const n = bomModal.items.filter((_, i) => i !== bIdx); setBomModal({...bomModal, items: n}); }} className="text-gray-400 hover:text-red-500 p-1"><i className="fas fa-trash-alt"></i></button></div>
                                            </div>
                                        ))}
                                        <button type="button" onClick={() => setBomModal({...bomModal, items: [...bomModal.items, { partNo: '', name: '', qty: 1, unitPrice: '', remark: '' }]})} className="w-full py-2 bg-purple-50 text-purple-600 hover:bg-purple-100 rounded-lg text-xs font-bold border border-purple-200">
                                            <i className="fas fa-plus mr-1"></i> 新增一列組件
                                        </button>
                                    </div>

                                    <div className="mt-4 pt-4 border-t flex justify-between items-center">
                                        <div className="text-sm">
                                            <span className="text-gray-500 mr-2">BOM 總金額合計：</span>
                                            <span className="text-lg font-black text-blue-700">
                                                {formatRMB(bomModal.items.reduce((sum, item) => sum + ((Number(item.qty) || 0) * (Number(item.unitPrice) || 0)), 0))}
                                            </span>
                                        </div>
                                        <div className="flex gap-2">
                                            <button type="button" onClick={() => setBomModal({ isOpen: false, priceId: null, modelName: '', items: [] })} className="px-4 py-2 bg-gray-100 rounded text-sm font-bold text-gray-700">取消</button>
                                            <button type="button" onClick={handleSaveBom} className="px-5 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded text-sm font-bold shadow-sm">儲存 BOM 並更新單價</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // ---------------- 採購單主畫面 ----------------
            return (
                <div className="max-w-6xl mx-auto p-4 md:p-8 space-y-5">
                    <datalist id="price-models">
                        {prices.map(p => <option key={p.id} value={p.model} />)}
                    </datalist>

                    {showLoginModal && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm">
                                <h2 className="text-lg font-bold mb-4">管理員登入</h2>
                                <form onSubmit={handleLogin} className="space-y-3">
                                    <input type="text" placeholder="帳號" value={loginForm.username} onChange={e => setLoginForm({...loginForm, username: e.target.value})} className="w-full border p-2 rounded" required />
                                    <input type="password" placeholder="密碼" value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} className="w-full border p-2 rounded" required />
                                    {loginError && <p className="text-red-500 text-xs">{loginError}</p>}
                                    <div className="flex gap-2 mt-4">
                                        <button type="button" onClick={() => setShowLoginModal(false)} className="flex-1 py-2 bg-gray-100 rounded text-sm">取消</button>
                                        <button type="submit" className="flex-1 py-2 bg-blue-600 text-white rounded text-sm">登入</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    <div className="flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                        <div>
                            <h1 className="text-xl font-bold text-gray-900">採購交期追蹤系統</h1>
                            <p className="text-xs text-blue-600 font-semibold mt-1"><i className="fas fa-cloud mr-1"></i>已連接雲端</p>
                        </div>
                        <div className="flex items-center gap-3 mt-3 md:mt-0 flex-wrap justify-end">
                            <div className={`px-3 py-1.5 rounded-lg text-sm font-medium ${isOnline ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'}`}>
                                <i className={`fas ${isOnline ? 'fa-tower-broadcast' : 'fa-triangle-exclamation'} mr-2`}></i>{isOnline ? '連線中' : '系統離線'}
                            </div>
                            
                            <button onClick={() => setCurrentView('INVENTORY_MANAGEMENT')} className="px-3 py-1.5 bg-green-100 text-green-700 rounded-lg text-sm font-bold hover:bg-green-200 shadow-sm border border-green-200 transition-colors">
                                <i className="fas fa-warehouse mr-2"></i>庫存查詢
                            </button>

                            {isAdmin && (
                                <div className="flex gap-2">
                                    <button onClick={() => setCurrentView('VENDOR_MANAGEMENT')} className="px-3 py-1.5 bg-indigo-100 text-indigo-700 rounded-lg text-sm font-bold hover:bg-indigo-200 shadow-sm border border-indigo-200">
                                        <i className="fas fa-building mr-2"></i>廠商管理
                                    </button>
                                    <button onClick={() => setCurrentView('PRICE_MANAGEMENT')} className="px-3 py-1.5 bg-blue-100 text-blue-700 rounded-lg text-sm font-bold hover:bg-blue-200 shadow-sm border border-blue-200">
                                        <i className="fas fa-tags mr-2"></i>單價管理
                                    </button>
                                </div>
                            )}

                            {currentUser ? (
                                <button onClick={handleLogout} className="px-3 py-1.5 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium border border-gray-300">
                                    <i className="fas fa-sign-out-alt mr-2"></i>登出 ({currentUser})
                                </button>
                            ) : (
                                <button onClick={() => setShowLoginModal(true)} className="px-3 py-1.5 bg-gray-900 text-white rounded-lg text-sm font-medium shadow-sm">
                                    <i className="fas fa-user-shield mr-2"></i>管理員登入
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="flex flex-wrap gap-3">
                        <div onClick={() => setActiveFilter(activeFilter === 'PROCESSING' ? 'ALL' : 'PROCESSING')} className={`px-4 py-2 min-w-[110px] rounded-lg border shadow-sm cursor-pointer ${activeFilter === 'PROCESSING' ? 'bg-blue-50 border-blue-400' : 'bg-white hover:bg-gray-50'}`}>
                            <p className="text-xs text-gray-500 font-medium">處理中</p>
                            <p className="text-lg font-bold text-blue-600">{orders.filter(o => o.status === '處理中').length} 件</p>
                        </div>
                        <div onClick={() => setActiveFilter(activeFilter === 'OVERDUE' ? 'ALL' : 'OVERDUE')} className={`px-4 py-2 min-w-[110px] rounded-lg border shadow-sm cursor-pointer ${activeFilter === 'OVERDUE' ? 'bg-red-50 border-red-400' : 'bg-white hover:bg-gray-50'}`}>
                            <p className="text-xs text-gray-500 font-medium">已逾期</p>
                            <p className="text-lg font-bold text-red-600">{orders.filter(o => getAlertInfo(o.deliveryDate, o.status).text.includes('已逾期')).length} 件</p>
                        </div>
                        
                        {isAdmin && (
                            <div className="px-4 py-2 min-w-[130px] bg-white rounded-lg border shadow-sm">
                                <p className="text-xs text-gray-500 font-medium">總金額 (內部顯示)</p>
                                <p className="text-lg font-bold text-gray-900">{formatRMB(totalAmount)}</p>
                            </div>
                        )}

                        <button onClick={() => { setShowAddForm(!showAddForm); }} className="ml-auto flex items-center px-4 py-2.5 bg-gray-900 text-white rounded-lg text-sm font-medium hover:bg-gray-800 transition-colors">
                            <i className={`fas ${showAddForm ? 'fa-times' : 'fa-plus'} mr-2`}></i>{showAddForm ? '取消新增' : '新增採購單'}
                        </button>
                    </div>

                    <div className="bg-white p-3 rounded-lg shadow-sm border border-gray-200 flex flex-wrap gap-4 items-center">
                        <div className="flex-1 relative">
                            <i className="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                            <input type="text" placeholder="輸入訂單編號或供應商..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="pl-9 pr-3 py-2 w-full border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" />
                        </div>
                        <div className="flex items-center gap-2">
                            <i className="far fa-calendar text-gray-400"></i>
                            <input type="date" value={dateRange.start} onChange={e => setDateRange({...dateRange, start: e.target.value})} className="border rounded-lg px-2 py-1.5 text-sm" />
                            <span className="text-gray-500">至</span>
                            <input type="date" value={dateRange.end} onChange={e => setDateRange({...dateRange, end: e.target.value})} className="border rounded-lg px-2 py-1.5 text-sm" />
                        </div>
                    </div>

                    {showAddForm && (
                        <div className="bg-white p-5 rounded-xl shadow-md border border-blue-300">
                            <div className="flex justify-between items-center mb-3 border-b pb-2">
                                <h2 className="font-bold text-blue-900"><i className="fas fa-plus mr-2"></i>填寫採購單</h2>
                                {isAdmin && (
                                    <span className="text-xs font-bold text-green-700 bg-green-100 px-2 py-1 rounded">
                                        自動加總: {formatRMB(calculateFormTotal())}
                                    </span>
                                )}
                            </div>
                            <form onSubmit={handleSubmit} noValidate className="space-y-4">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                    <div><label className="block text-xs text-gray-700">訂單編號</label><input type="text" value={formData.displayId} onChange={e => setFormData({...formData, displayId: e.target.value})} placeholder="留空由系統自動產生" className="w-full px-3 py-1.5 border rounded text-sm outline-none" /></div>
                                    <div>
                                        <label className="block text-xs font-bold mb-1 text-gray-700">供應商 (從廠商管理建立)</label>
                                        <select value={formData.vendor} onChange={e => setFormData({...formData, vendor: e.target.value})} className="w-full px-3 py-1.5 border rounded text-sm bg-white outline-none">
                                            <option value="">請選擇供應商...</option>
                                            {vendors.map(v => <option key={v.id} value={v.name}>{v.name}</option>)}
                                        </select>
                                    </div>
                                    <div><label className="block text-xs text-gray-700">訂單日期</label><input type="date" value={formData.orderDate} onChange={e => setFormData({...formData, orderDate: e.target.value})} className="w-full px-3 py-1.5 border rounded text-sm outline-none" /></div>
                                    
                                    <div className="md:col-span-3 flex flex-col md:flex-row gap-3">
                                        <div className="w-full md:w-1/3">
                                            <label className="block text-xs font-bold mb-1 text-gray-700">預計交期</label>
                                            <input type="date" value={formData.deliveryDate} onChange={e => setFormData({...formData, deliveryDate: e.target.value})} className="w-full px-3 py-1.5 border rounded text-sm outline-none" />
                                        </div>
                                        <div className="w-full md:w-2/3">
                                            <label className="block text-xs font-bold mb-1 text-gray-700">訂單備註</label>
                                            <input type="text" value={formData.orderRemark} onChange={e => setFormData({...formData, orderRemark: e.target.value})} placeholder="整筆訂單的備註事項..." className="w-full px-3 py-1.5 border rounded text-sm outline-none" />
                                        </div>
                                    </div>
                                </div>
                                
                                <div className="bg-gray-50 p-3 rounded border overflow-x-auto">
                                    <div className="flex justify-between items-center mb-2">
                                        <h3 className="text-xs font-bold text-gray-800">採購細項</h3>
                                        <button type="button" onClick={() => setFormData({...formData, items: [...formData.items, {model:'', vendorModel:'', quantity:1, unitPrice:'', unitPriceUsd:'', remark:''}]})} className="text-xs text-blue-600 font-bold bg-blue-100 px-2 py-1 rounded"><i className="fas fa-plus mr-1"></i>新增一列</button>
                                    </div>
                                    {formData.items.map((item, index) => (
                                        <div key={index} className="flex gap-2 mb-2 items-start flex-wrap sm:flex-nowrap pb-2 border-b sm:border-0">
                                            <div className="flex flex-col gap-1 w-full sm:w-48 shrink-0">
                                                <input type="text" list="price-models" placeholder="精機型號" value={item.model} 
                                                    onChange={e => {
                                                        const val = e.target.value;
                                                        const n = [...formData.items]; 
                                                        n[index].model = val; 
                                                        const priceObj = prices.find(p => p.model.toLowerCase() === val.trim().toLowerCase());
                                                        if (priceObj) {
                                                            n[index].unitPrice = priceObj.price;
                                                            n[index].unitPriceUsd = priceObj.priceUsd || '';
                                                            n[index].vendorModel = priceObj.vendorModel || '';
                                                        }
                                                        setFormData({...formData, items: n});
                                                    }} 
                                                    className="w-full px-2 py-1.5 text-sm border rounded outline-none" />
                                                <div className="flex gap-1">
                                                    <input type="number" step="0.01" placeholder="RMB" value={item.unitPrice} onChange={e => {const n=[...formData.items]; n[index].unitPrice=e.target.value; setFormData({...formData, items: n})}} className="w-1/2 px-2 py-1 text-xs border rounded text-center bg-white" />
                                                    <input type="number" step="0.01" placeholder="USD" value={item.unitPriceUsd} onChange={e => {const n=[...formData.items]; n[index].unitPriceUsd=e.target.value; setFormData({...formData, items: n})}} className="w-1/2 px-2 py-1 text-xs border rounded text-center bg-white" />
                                                </div>
                                            </div>
                                            <input type="text" placeholder="廠商型號" value={item.vendorModel} onChange={e => {const n=[...formData.items]; n[index].vendorModel=e.target.value; setFormData({...formData, items: n})}} className="w-full sm:w-32 px-2 py-1.5 text-sm border rounded shrink-0" />
                                            <input type="number" placeholder="數量" value={item.quantity} onChange={e => {const n=[...formData.items]; n[index].quantity=e.target.value; setFormData({...formData, items: n})}} className="w-14 px-2 py-1.5 text-sm border rounded text-center shrink-0" />
                                            <input type="text" placeholder="備註" value={item.remark} onChange={e => {const n=[...formData.items]; n[index].remark=e.target.value; setFormData({...formData, items: n})}} className="flex-1 min-w-[80px] w-full px-2 py-1.5 text-sm border rounded" />
                                            <button type="button" onClick={() => setFormData({...formData, items: formData.items.filter((_,i)=>i!==index)})} disabled={formData.items.length===1} className="text-gray-400 hover:text-red-500 p-1 mt-1 shrink-0"><i className="fas fa-trash-alt"></i></button>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex justify-end">
                                    <button type="submit" disabled={isSubmitting} className="bg-blue-600 text-white font-bold py-2 px-8 rounded shadow-sm hover:bg-blue-700 text-sm">
                                        {isSubmitting ? '儲存中...' : '儲存採購單'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <table className="w-full text-left">
                            <thead className="bg-gray-100 text-sm text-gray-600">
                                <tr>
                                    <th className="px-5 py-3">訂單編號</th>
                                    <th className="px-5 py-3">供應商</th>
                                    <th className="px-5 py-3 cursor-pointer" onClick={() => setSortOrder(prev => prev==='desc'?'asc':'desc')}>
                                        訂單日期 <i className={`fas fa-arrow-${sortOrder==='desc'?'down':'up'} ml-1`}></i>
                                    </th>
                                    <th className="px-5 py-3">交期</th>
                                    <th className="px-5 py-3">狀態</th>
                                    <th className="px-5 py-3">警示</th>
                                    <th className="px-5 py-3 text-center">詳情</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100 text-sm">
                                {processedOrders.map(order => {
                                    const alert = getAlertInfo(order.deliveryDate, order.status);
                                    const isExpanded = expandedOrderId === order.dbId;
                                    const orderDateStr = order.orderDate || '未知日期';
                                    const orderMonth = order.orderDate ? new Date(order.orderDate).toLocaleString('zh-TW', { year: 'numeric', month: 'long' }) : '未填寫日期';
                                    const showMonthDivider = currentMonthGroup !== orderMonth;
                                    if (showMonthDivider) currentMonthGroup = orderMonth;

                                    return (
                                        <React.Fragment key={order.dbId}>
                                            {showMonthDivider && (
                                                <tr className="bg-blue-50/50 border-y border-blue-100"><td colSpan="7" className="px-5 py-1.5 text-xs font-bold text-blue-800">{orderMonth}</td></tr>
                                            )}
                                            <tr onClick={() => setExpandedOrderId(isExpanded ? null : order.dbId)} className={`hover:bg-gray-50 cursor-pointer ${isExpanded ? 'bg-blue-50/20' : ''}`}>
                                                <td className="px-5 py-3 font-bold">{order.displayId}</td>
                                                <td className="px-5 py-3">{order.vendor}</td>
                                                <td className="px-5 py-3 text-gray-500">{orderDateStr}</td>
                                                <td className="px-5 py-3 font-bold">{order.deliveryDate || '-'}</td>
                                                <td className="px-5 py-3"><span className={`px-2 py-0.5 rounded-full text-xs font-bold ${order.status==='已收貨'?'bg-gray-200':'bg-blue-100 text-blue-700'}`}>{order.status}</span></td>
                                                <td className="px-5 py-3"><span className={`px-2 py-0.5 rounded text-xs font-bold ${alert.bg} ${alert.color}`}>{alert.text}</span></td>
                                                <td className="px-5 py-3 text-center text-gray-400"><i className={`fas fa-chevron-${isExpanded?'up':'down'}`}></i></td>
                                            </tr>

                                            {isExpanded && (
                                                <tr className="bg-[#f0f7ff] border-b-2">
                                                    <td colSpan="7" className="p-0">
                                                        <div className="p-6 flex flex-col shadow-inner w-full">
                                                            <div className="w-full overflow-x-auto">
                                                                <div className="flex justify-between items-center mb-3 border-b pb-2 flex-wrap gap-2">
                                                                    <h4 className="font-bold text-gray-800">訂單細項</h4>
                                                                    {isAdmin && (
                                                                        <div className="flex items-center gap-4 flex-wrap justify-end">
                                                                            <span className="text-sm font-black text-blue-900">總金額: {formatRMB(order.amount)}</span>
                                                                            <button onClick={() => handleDeleteOrder(order.dbId)} className="text-xs bg-red-50 text-red-600 px-2 py-1 rounded font-bold border border-red-200"><i className="fas fa-trash mr-1"></i>刪除採購單</button>
                                                                        </div>
                                                                    )}
                                                                </div>
                                                                
                                                                <div className="overflow-x-auto rounded-lg border bg-white shadow-sm mt-2">
                                                                    <table className="w-full text-left">
                                                                        <thead>
                                                                            <tr className="bg-gray-100 text-xs font-semibold text-gray-600 border-b">
                                                                                <th className="py-2 px-3">精機型號</th>
                                                                                <th className="py-2 px-3">廠商型號</th>
                                                                                <th className="py-2 px-3 text-center">數量</th>
                                                                                {isAdmin && <th className="py-2 px-3 text-right">單價 (RMB)</th>}
                                                                                <th className="py-2 px-3">備註</th>
                                                                            </tr>
                                                                        </thead>
                                                                        <tbody className="divide-y text-sm">
                                                                            {order.items?.map((item, idx) => (
                                                                                <tr key={idx} className="hover:bg-blue-50/50">
                                                                                    <td className="py-2 px-3 font-semibold">{item.model}</td>
                                                                                    <td className="py-2 px-3 text-gray-600">{item.vendorModel || '-'}</td>
                                                                                    <td className="py-2 px-3 text-center"><span className="bg-gray-100 px-2 py-0.5 rounded text-xs">x {item.quantity}</span></td>
                                                                                    {isAdmin && <td className="py-2 px-3 text-right font-bold text-blue-700">{formatRMB(item.unitPrice || 0)}</td>}
                                                                                    <td className="py-2 px-3 text-gray-500 text-xs">{item.remark || '-'}</td>
                                                                                </tr>
                                                                            ))}
                                                                        </tbody>
                                                                    </table>
                                                                </div>
                                                            </div>

                                                            {order.status !== '已收貨' ? (
                                                                <div className="m-4 p-3 bg-white border border-blue-100 rounded-lg shadow-sm space-y-2">
                                                                    <h4 className="text-sm font-bold text-gray-800"><i className="fas fa-check-circle text-green-500 mr-1"></i>標記為已完成 (收貨)</h4>
                                                                    {isAdmin ? (
                                                                        <div className="flex gap-3 items-center flex-wrap">
                                                                            <input type="date" value={completeData.date} onChange={e=>setCompleteData({...completeData, date:e.target.value})} className="border rounded px-2 py-1.5 text-sm"/>
                                                                            <select value={completeData.targetLoc} onChange={e=>setCompleteData({...completeData, targetLoc:e.target.value})} className="border rounded px-2 py-1.5 text-sm bg-white font-bold text-blue-700">
                                                                                <option value="崑山">加入崑山庫存</option>
                                                                                <option value="台灣">加入台灣庫存</option>
                                                                            </select>
                                                                            <input type="text" placeholder="輸入結案備註..." value={completeData.remark} onChange={e=>setCompleteData({...completeData, remark:e.target.value})} className="border rounded px-2 py-1.5 text-sm flex-1"/>
                                                                            <button onClick={() => handleCompleteOrder(order.dbId)} className="bg-green-600 hover:bg-green-700 text-white px-5 py-1.5 rounded text-sm font-bold">確認完成</button>
                                                                        </div>
                                                                    ) : <div className="text-sm text-red-600 bg-red-50 p-2.5 rounded border">僅限授權帳號 (Ryan) 執行結案收貨。</div>}
                                                                </div>
                                                            ) : (
                                                                <div className="m-4 p-3 bg-gray-100 rounded-lg text-xs text-gray-600 border">
                                                                    此訂單已於 <strong>{order.completionData?.date}</strong> 結案。存入位置：{order.completionData?.targetLoc || '崑山'} {order.completionData?.remark && <span>(備註：{order.completionData.remark})</span>}
                                                                </div>
                                                            )}
                                                        </div>
                                                    </td>
                                                </tr>
                                            )}
                                        </React.Fragment>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
